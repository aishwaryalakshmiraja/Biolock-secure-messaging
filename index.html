<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Biolock Secure Messaging</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 90%;
            max-width: 400px;
            background: #1e293b;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }

        .icon {
            font-size: 60px;
        }

        h1 {
            margin-bottom: 10px;
        }

        .subtitle {
            color: #cbd5e1;
            margin-bottom: 30px;
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            background: #2563eb;
            color: white;
            font-size: 17px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        #status {
            margin-top: 20px;
            color: #cbd5e1;
        }

        #messages {
            display: none;
            margin-top: 25px;
            padding: 15px;
            background: #334155;
            border-radius: 12px;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="icon">🔐</div>

    <h1>Biolock</h1>

    <p class="subtitle">Secure Messaging System</p>

    <p>Your messages are protected using biometric authentication.</p>

    <button onclick="unlockMessages()">
        🔒 Unlock Messages
    </button>

    <p id="status"></p>

    <div id="messages">
        <h2>💬 Messages Unlocked</h2>
        <p>Welcome to your secure messages.</p>
        <p>🔒 Biometric authentication successful.</p>
    </div>

</div>

<script>

async function unlockMessages() {

    const status = document.getElementById("status");
    const messages = document.getElementById("messages");

    if (!window.PublicKeyCredential) {
        status.innerText =
            "❌ This browser does not support biometric authentication.";
        return;
    }

    try {

        status.innerText = "🔍 Starting biometric authentication...";

        const challenge = crypto.getRandomValues(
            new Uint8Array(32)
        );

        const userId = crypto.getRandomValues(
            new Uint8Array(16)
        );

        const credential =
            await navigator.credentials.create({

                publicKey: {

                    challenge: challenge,

                    rp: {
                        name: "Biolock Secure Messaging"
                    },

                    user: {
                        id: userId,
                        name: "biolock-user",
                        displayName: "Biolock User"
                    },

                    pubKeyCredParams: [
                        {
                            type: "public-key",
                            alg: -7
                        },
                        {
                            type: "public-key",
                            alg: -257
                        }
                    ],

                    authenticatorSelection: {
                        authenticatorAttachment: "platform",
                        userVerification: "required"
                    },

                    timeout: 60000,

                    attestation: "none"
                }
            });

        if (credential) {

            status.innerText =
                "✅ Biometric authentication successful!";

            messages.style.display = "block";
        }

    } catch (error) {

        console.log(error);

        status.innerText =
            "❌ Authentication cancelled or unavailable.";
    }
}

</script>

</body>
</html>
